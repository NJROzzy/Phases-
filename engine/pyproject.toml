[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phases-engine"
version = "0.1.0"
description = "PHASES simulation engine: six-phase experiment lifecycle and pluggable simulation models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phases-engine = "phases_engine.cli:main"

[tool.setuptools.packages.find]
include = ["phases_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
