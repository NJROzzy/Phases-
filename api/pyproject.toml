[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phases-api"
version = "0.1.0"
description = "PHASES laboratory API: experiments, runs and live streaming over the PHASES engine"
requires-python = ">=3.10"
dependencies = [
  "phases-engine",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["phases_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
